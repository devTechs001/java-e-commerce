server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: e-commerce-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_new_id_inserts: true
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentChangeInProduction}
  expiration: 86400000

app:
  frontend:
    url: http://localhost:5173