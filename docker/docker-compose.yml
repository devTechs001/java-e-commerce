services:
  postgres:
    image: postgres:15-alpine
    container_name: e-commerce-db
    environment:
      POSTGRES_DB: e-commerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - e-commerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../java-e-commerce
      dockerfile: docker/Dockerfile
    container_name: e-commerce-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/e-commerce
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e-commerce
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../java-e-commerce/docker/frontend.Dockerfile
    container_name: e-commerce-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - e-commerce
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  e-commerce:
    driver: bridge
